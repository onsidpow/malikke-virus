<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>말리끄 바이러스 · 관리 모드</title><style>body{margin:0;background:#0b141e;color:#c8d6db;font:14px Arial,sans-serif;display:grid;place-items:center;min-height:100dvh}a{color:#c9b58d}</style></head><body><p id="loading">관리 모드를 불러오는 중…</p><script>
(async()=>{const root=new URL('../',location.href);try{const response=await fetch(new URL('index.html',root),{cache:'no-store'});if(!response.ok)throw Error('unavailable');const page=await response.text();const documentText=page.replace('<head>','<head><base href="'+root.href+'">');document.open();document.write(documentText);document.close()}catch(error){document.getElementById('loading').textContent='게임을 불러오지 못했습니다. 연결을 확인한 뒤 새로고침해 주세요.'}})();
</script></body></html>
